info:
  name: Delete a post
  type: http
  seq: 2

http:
  method: DELETE
  url: http://localhost:8000/api/v1/posts/1
  headers:
    - name: Authorization
      value: Bearer <token>
    - name: Accept
      value: application/json
  body:
    type: json
    data: |-
      {
        "title": "Titre modifié",
        "content": "Contenu modifié."
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
