info:
  name: Report a post
  type: http
  seq: 6

http:
  method: POST
  url: http://localhost:8000/api/v1/posts/1/report
  headers:
    - name: Authorization
      value: Bearer <token>
    - name: Accept
      value: application/json
  body:
    type: json
    data: |-
      {
        "reason": "Ce post contient du contenu inapproprié."
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
