info:
  name: Get a post
  type: http
  seq: 1

http:
  method: GET
  url: http://localhost:8000/api/v1/posts/1
  headers:
    - name: Authorization
      value: Bearer <token>
    - name: Accept
      value: application/json
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
